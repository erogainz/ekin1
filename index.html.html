<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siyah Arkaplanlı Web Sitesi</title>
    <style>
        body {
            background-color: black; /* Arkaplan siyah */
            color: white;            /* Yazı rengi beyaz */
            font-family: Arial, sans-serif; /* Yazı tipi */
            display: flex;           /* Merkezi hizalama için */
            justify-content: center;
            align-items: center;
            height: 100vh;          /* Yüksekliği tam ekran */
            margin: 0;              /* Varsayılan boşlukları kaldır */
        }
        h1 {
            text-align: center;     /* Yazıyı ortala */
        }
    </style>
</head>
<body>
    <h1>77773366444 777733888444999666777886</h1>
</body>
</html>
